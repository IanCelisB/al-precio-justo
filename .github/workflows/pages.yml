# Datos de mercado y página en GitHub Pages.
#
# Arma la base de datos desde cero (reportes de la SEC + precios), la publica en la
# versión "datos" del repositorio (de ahí la descarga la API en Render) y publica la
# app (Expo web) en GitHub Pages:
#   - Sin la variable del repositorio API_URL: modo demo (foto fija de los datos,
#     todo guardado en el navegador; EXPO_PUBLIC_ANCLA_DEMO=1).
#   - Con API_URL (p. ej. https://al-precio-justo-api.onrender.com): la app real,
#     conectada a la API, con login de Google (variable GOOGLE_WEB_CLIENT_ID), avisos
#     y base de datos Postgres.
#
# Se ejecuta al subir cambios a main, a mano y de lunes a viernes tras el cierre de la bolsa.
# Si una ejecución falla, la página sigue mostrando la última versión publicada.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write     # publicar la base en la versión "datos"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Nombre y email de contacto que exige la SEC (secreto del repositorio).
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Trimestres de las ~1.000 empresas (SEC)
        run: |
          test -n "$SEC_USER_AGENT" || { echo "Falta el secreto SEC_USER_AGENT"; exit 1; }
          python -m ingesta.ejecutar --todas | tail -15 || true
          n=$(python -c "import sqlite3; print(sqlite3.connect('data/ancla.db').execute('select count(*) from companies').fetchone()[0])")
          echo "Empresas con trimestres: $n"
          test "$n" -ge 900 || { echo "Muy pocas empresas: no se publica"; exit 1; }

      - name: Precios (10 años)
        run: |
          python -m ingesta.precios --todas --rango 10y || true
          n=$(python -c "import sqlite3; print(sqlite3.connect('data/ancla.db').execute('select count(*) from quotes').fetchone()[0])")
          echo "Empresas con precio: $n"
          test "$n" -ge 800 || { echo "Muy pocas empresas con precio: no se publica"; exit 1; }

      - name: Tipos de cambio (BCE y Banco Central de Chile)
        run: python -m ingesta.divisas || true

      - name: Perfiles (Wikipedia, Wikidata y desglose de ventas del último 10-K)
        run: python -m ingesta.perfil --todas | tail -5 || true

      - name: API y foto de los datos
        run: |
          node apps/api/src/server.ts > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4000/salud && break; sleep 2; done
          node apps/api/src/foto-demo.ts

      - name: Base para la API publicada (versión "datos")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copia sin las tablas que solo usa la ingesta, comprimida.
          rm -f ancla-api.db
          python -c "import sqlite3; sqlite3.connect('data/ancla.db').execute(\"VACUUM INTO 'ancla-api.db'\")"
          python -c "import sqlite3; c = sqlite3.connect('ancla-api.db'); c.execute('DROP TABLE IF EXISTS facts'); c.execute('DROP TABLE IF EXISTS quality_issues'); c.commit(); c.execute('VACUUM')"
          gzip -9 -c ancla-api.db > ancla.db.gz
          ls -lh ancla-api.db ancla.db.gz
          gh release view datos > /dev/null 2>&1 || gh release create datos --title "Datos de mercado" --latest=false \
            --notes "Base de datos de mercado que usa la API publicada. Se reemplaza en cada actualización."
          gh release upload datos ancla.db.gz --clobber

      - name: App (demo, o conectada a la API si hay API_URL)
        working-directory: apps/movil
        env:
          EXPO_PUBLIC_ANCLA_DEMO: ${{ vars.API_URL == '' && '1' || '' }}
          EXPO_PUBLIC_ANCLA_API: ${{ vars.API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_BASE: ${{ env.BASE }}
          EXPO_BASE_URL: ${{ env.BASE }}
        run: |
          npx expo export --platform web --output-dir dist
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/movil/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
